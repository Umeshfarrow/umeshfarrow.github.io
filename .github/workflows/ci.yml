name: Quality & security

# Pipeline stages (run on every push/PR to the deploy branch):
#   Stage 1 · Lint            (oxlint — code smells)
#   Stage 2 · Production build (vite build)
#   Stage 3 · Dependency audit (AppSec — npm audit on prod deps)
#   Stage 4 · CodeQL SAST      (AppSec — security-and-quality queries)
#
# Stage 1 and 2 are a linear gate; Stage 3 and 4 run in parallel
# once the build is proven. No test stage: this is a single-page
# static site with no test framework (see AGENTS.md).

on:
  push:
    branches: [new-era-2026]
  pull_request:
    branches: [new-era-2026]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Stage 1 · Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

  build:
    name: Stage 2 · Production build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (vite)
        run: npm run build

  audit:
    name: Stage 3 · Dependency audit
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  codeql:
    name: Stage 4 · CodeQL SAST
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3